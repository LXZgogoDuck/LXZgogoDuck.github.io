<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#7CB342"/>

  <!-- Title -->
  <text x="200" y="85" font-family="Arial, sans-serif" font-size="20" font-weight="bold"
        fill="white" text-anchor="middle">Multimodal Attention</text>

  <!-- Subtitle -->
  <text x="200" y="110" font-family="Arial, sans-serif" font-size="13"
        fill="#FFFFFF" opacity="0.9" text-anchor="middle">Visual + Auditory Synchronization</text>

  <!-- Visual representation -->
  <g transform="translate(50, 140)">
    <!-- Visual input -->
    <rect x="0" y="0" width="70" height="60" fill="white" opacity="0.25" rx="4"/>
    <text x="35" y="20" font-size="28" text-anchor="middle">👁️</text>
    <text x="35" y="45" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Visual</text>
    <text x="35" y="57" font-size="10" fill="white" text-anchor="middle">Cues</text>

    <!-- Plus sign -->
    <text x="95" y="35" font-size="24" fill="white" font-weight="bold">+</text>

    <!-- Auditory input -->
    <rect x="120" y="0" width="70" height="60" fill="white" opacity="0.25" rx="4"/>
    <text x="155" y="20" font-size="28" text-anchor="middle">🔊</text>
    <text x="155" y="45" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Auditory</text>
    <text x="155" y="57" font-size="10" fill="white" text-anchor="middle">Input</text>

    <!-- Arrow -->
    <path d="M 210 30 L 240 30" stroke="white" stroke-width="3" marker-end="url(#arrow2)"/>

    <!-- Enhanced perception -->
    <rect x="250" y="5" width="70" height="50" fill="#FFD700" opacity="0.85" rx="4"/>
    <text x="285" y="23" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Enhanced</text>
    <text x="285" y="38" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Perception</text>
  </g>

  <!-- Decorative elements -->
  <circle cx="60" cy="50" r="18" fill="white" opacity="0.2"/>
  <circle cx="340" cy="250" r="28" fill="white" opacity="0.15"/>

  <!-- Award badge -->
  <g transform="translate(330, 20)">
    <circle cx="0" cy="0" r="20" fill="#FFD700" opacity="0.9"/>
    <text x="0" y="6" font-size="22" text-anchor="middle">🏆</text>
  </g>

  <!-- Award text -->
  <text x="200" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        fill="white" text-anchor="middle">Best Student Paper - ICSR 2024</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="white"/>
    </marker>
  </defs>

  <!-- Footer text -->
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="10"
        fill="white" opacity="0.7" text-anchor="middle">Eye-tracking | Multi-speaker Environments</text>
</svg>