<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · {{ site.title }}</title>
{% if page.description %}<meta name="description" content="{{ page.description | escape }}">{% endif %}
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
{% if page.math %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}]});"></script>
{% endif %}
</head>
<body>
<main>
  <nav class="site-nav"><a href="{{ '/' | relative_url }}">Xuanzhuo Liu</a><a href="{{ '/blog/' | relative_url }}">blog</a></nav>
  <article class="post">
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.kind %} · {{ page.kind }}{% endif %}</div>
    {{ content }}
  </article>
  <footer><a href="{{ '/blog/' | relative_url }}">&larr; all posts</a></footer>
</main>
</body>
</html>
